name: Browser smoke test
on:
  push:
    branches: [main, fix/weapon-grip-swim-angle]
  workflow_dispatch:
concurrency:
  group: wanderlands-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderlands-visual-review
          path: test-results/
          retention-days: 3
