const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide});
const bark=new THREE.MeshStandardMaterial({color:0x594637,roughness:1});

const leafColors=[0x31593b,0x3b683d,0x537e45,0x284c37];

const player=new THREE.Group();scene.add(player);

  camera,scene,

const fallbackAvatar=new THREE.Group();avatar.add(fallbackAvatar);

piece(fallbackAvatar,new THREE.CapsuleGeometry(.34,.62,4,8),shirt,0,1.65,0);
piece(fallbackAvatar,new THREE.SphereGeometry(.28,12,8),skin,0,2.66,0);

   state='pistolShoot';

const hint=document.createElement('div');

  padding:'8px 14px',borderRadius:'8px',background:'#162c3cc9',color:'white',
  font:'13px system-ui',pointerEvents:'none',zIndex:'7'});

 const nativeSwim=swimming&&characterActions?.swim&&characterActions?.tread;

 // surface-swim pose. Treading water remains upright.
 const targetTilt=swimming?(moving?-1.36:0):0;
 rigPivot.rotation.x=THREE.MathUtils.lerp(rigPivot.rotation.x,targetTilt,Math.min(1,dt*5));
 updateCharacterAnimation(dt,{moving,sprint,swimming,onGround});
 for(let i=0;i<2;i++){
  const phase=step+i*Math.PI;
  const legAngle=swimming?Math.sin(phase*1.3)*.32:!onGround?-.25:moving?Math.sin(phase)*(wading?.32:.5):0;
  const armAngle=swimming?-.8+Math.sin(phase)*.85:!onGround?-.35:moving?-Math.sin(phase)*(wading?.2:.35):0;
  legs[i].rotation.x=THREE.MathUtils.lerp(legs[i].rotation.x,legAngle,Math.min(1,dt*10));
  arms[i].rotation.x=THREE.MathUtils.lerp(arms[i].rotation.x,armAngle,Math.min(1,dt*10));
  arms[i].rotation.z=THREE.MathUtils.lerp(arms[i].rotation.z,swimming?(i===0?-.38:.38):0,Math.min(1,dt*8));
 }
 stream(player.position.x,player.position.z);
 water.material.uniforms.time.value+=dt;
 sun.position.set(player.position.x+55,player.position.y+95,player.position.z+30);
 sun.target.position.copy(player.position);sun.target.updateMatrixWorld();
 const p=player.position;let target;
 if(mode===1){
  camera.position.lerp(new THREE.Vector3(p.x,p.y+27,p.z+15),Math.min(1,dt*5));
  target=new THREE.Vector3(p.x,p.y+1,p.z);
 }else if(mode===2){
  const d=swimming?10:6.2,h=Math.cos(pitch)*d;
  camera.position.lerp(new THREE.Vector3(p.x+Math.sin(yaw)*h,p.y+(swimming?2.8:2.0)+Math.sin(pitch)*d,p.z+Math.cos(yaw)*h),Math.min(1,dt*8));
  target=new THREE.Vector3(p.x,p.y+(swimming?1.4:1.6),p.z);
 }else{
  camera.position.set(p.x,p.y+(swimming?2.0:2.62),p.z);
  target=camera.position.clone().add(new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),-Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(10));
 }
 camera.lookAt(target);
 const submerged=camera.position.y<WATER_LEVEL-.08;
 scene.fog.color.copy(submerged?underwaterFog:airFog);
 scene.fog.density=submerged?.036:.0035;
 scene.background.copy(submerged?underwaterFog:skyColor);
 weapons.update(dt,{mode,swimming,moving,sprint,playerYaw:player.rotation.y});
 const label=swimming?(swimDive>.25?'Diving':'Swimming'):!onGround?'Jumping':wading?'Wading':moving?(sprint?'Sprinting':'Walking'):'Exploring';
 document.querySelector('#stats').textContent=label+' · X '+p.x.toFixed(0)+' · Z '+p.z.toFixed(0)+' · '+chunks.size+' chunks';
 renderer.render(scene,camera);
}

// Read-only diagnostics and a local test teleport, exposed only with ?debug=1.
if(new URLSearchParams(location.search).has('debug')){
 window.__wanderlandsDebug={
  state:()=>({
   waterIsOfficial:water.isWater===true,
   waterHorizontal:Math.abs(water.rotation.x+Math.PI/2)<.00001,
   waterCenter:{x:water.position.x,y:water.position.y,z:water.position.z},
   waterNormalsLoaded:!!(waterNormals.image&&waterNormals.image.width>0),
   characterLoaded:!!characterMixer,
   depth:WATER_LEVEL-ground(player.position.x,player.position.z),
   x:player.position.x,z:player.position.z,y:player.position.y,groundY:ground(player.position.x,player.position.z),
   swimming,swimDive,mode,onGround,verticalSpeed,jumpCount,weapons:weapons.debug(),
   pointerLocked,yaw,pitch,playerYaw:player.rotation.y,
   modelFacingRootYaw:modelFacingRoot.rotation.y,
   visualForward:characterModel?new THREE.Vector3(0,0,1).applyQuaternion(characterModel.getWorldQuaternion(new THREE.Quaternion())).toArray():null,
   cameraGroundForward:[-Math.sin(yaw),0,-Math.cos(yaw)],
   characterClipNames,activeCharacterState,characterAssetError,
   animationWeights:{
     swim:characterActions?.swim?.getEffectiveWeight()||0,
     tread:characterActions?.tread?.getEffectiveWeight()||0,
     shoot:characterActions?.pistolShoot?.getEffectiveWeight()||0,
     reload:characterActions?.pistolReload?.getEffectiveWeight()||0
   },
   handPose:characterModel?.getObjectByName('DEF-handR')?.quaternion.toArray()||null
  }),
  teleportLake:()=>{
   player.position.set(LAKE_X,ground(LAKE_X,LAKE_Z),LAKE_Z);
   velocity.set(0,0,0);swimDive=0;verticalSpeed=0;onGround=false;
  }
 };
}
stream(0,0);view(2);animate();
} catch(e){document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='Unable to start game: '+String(e);console.error(e)}
</script>
